name: Prepare signed Play Console package

# A manually initiated, developer-only build.
# This DOES NOT upload to Play Console, publish an APK, or alter Play Protect.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android API 36 and build tools
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check sensitive permission declarations
        run: python3 scripts/check_permission_scope.py
      - name: Restore private upload keystore
        env:
          PLAY_UPLOAD_KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in PLAY_UPLOAD_KEYSTORE_B64 PLAY_UPLOAD_STORE_PASSWORD PLAY_UPLOAD_KEY_ALIAS PLAY_UPLOAD_KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing $key. Follow docs/PLAY_CONSOLE_SUBMISSION.md; never commit private keys."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/adskip-upload.jks"
          test -s "$RUNNER_TEMP/adskip-upload.jks"
          echo "PLAY_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/adskip-upload.jks" >> "$GITHUB_ENV"
      - name: Build signed release bundle and APK
        env:
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:bundleRelease :app:assembleRelease
      - name: Verify signed APK and create checksums
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          aab="app/build/outputs/bundle/release/app-release.aab"
          test -s "$apk"
          test -s "$aab"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          jarsigner -verify "$aab" >/dev/null
          mkdir -p dist
          cp "$apk" "dist/AdSkip-Assist-review.apk"
          cp "$aab" "dist/AdSkip-Assist-review.aab"
          (cd dist && sha256sum AdSkip-Assist-review.apk AdSkip-Assist-review.aab > SHA256SUMS)
      - name: Upload review artifacts privately
        uses: actions/upload-artifact@v4
        with:
          name: play-review-signed-package
          path: dist/
          retention-days: 7
          if-no-files-found: error
      - name: Remove temporary upload keystore
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/adskip-upload.jks" ]]; then
            rm -f "$RUNNER_TEMP/adskip-upload.jks"
          fi
