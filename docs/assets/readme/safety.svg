<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="731" viewBox="0 0 1400 731" role="img"><defs><linearGradient id="sky" x2=".88" y2="1"><stop stop-color="#09121E"/><stop offset=".55" stop-color="#10243B"/><stop offset="1" stop-color="#11172B"/></linearGradient><linearGradient id="cyan" x2="1" y2="0"><stop stop-color="#75FFE0"/><stop offset=".52" stop-color="#59C6FF"/><stop offset="1" stop-color="#AD87FF"/></linearGradient><radialGradient id="glow"><stop stop-color="#1BA8BD" stop-opacity=".23"/><stop offset="1" stop-color="#1BA8BD" stop-opacity="0"/></radialGradient><radialGradient id="pink"><stop stop-color="#9562DB" stop-opacity=".23"/><stop offset="1" stop-color="#9562DB" stop-opacity="0"/></radialGradient><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#4B6D87" stroke-width=".5" opacity=".25"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#61DFF7" stroke-width="1.3"/></marker></defs><rect width="1400" height="731" fill="url(#sky)"/><rect width="1400" height="731" fill="url(#grid)"/><ellipse cx="308" cy="548.25" rx="574" ry="423.97999999999996" fill="url(#glow)"/><ellipse cx="1232" cy="109.64999999999999" rx="420" ry="402.05" fill="url(#pink)"/><text x="65" y="76" fill="#73EED7" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start" >TRUST &amp; CONTROL</text><text x="65" y="139" fill="#F8FBFF" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="750" text-anchor="start" >Designed to do less, safely.</text><text x="65" y="179" fill="#B4C9D9" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="500" text-anchor="start" >Useful automation with explicit boundaries and honest limitations.</text><rect x="70" y="221" width="623" height="60" rx="18" fill="#1A2F42" stroke="#65E3C9" stroke-width="1.3"/><text x="97" y="259" fill="#65E3C9" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" >CAPABILITIES</text><rect x="725" y="221" width="623" height="60" rx="18" fill="#1A2F42" stroke="#FFACB8" stroke-width="1.3"/><text x="752" y="259" fill="#FFACB8" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" >GUARDRAILS</text><rect x="70" y="297" width="623" height="71" rx="16" fill="#16283E" stroke="#385573" stroke-width="1.1"/><circle cx="100" cy="332" r="9" fill="none" stroke="#7DE9D3" stroke-width="2.5"/><path d="M95 332l4 4 8 -9" fill="none" stroke="#7DE9D3" stroke-width="2" stroke-linecap="round"/><text x="127" y="328" fill="#F0F8FE" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" >Game allowlist</text><text x="127" y="352" fill="#ABC6D8" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" text-anchor="start" >Runs only where you opt in.</text><rect x="725" y="297" width="623" height="71" rx="16" fill="#16283E" stroke="#385573" stroke-width="1.1"/><circle cx="755" cy="332" r="9" fill="none" stroke="#FFABBA" stroke-width="2.5"/><path d="M750 327l10 10 M760 327l-10 10" fill="none" stroke="#FFABBA" stroke-width="2" stroke-linecap="round"/><text x="782" y="328" fill="#F0F8FE" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" >No root or injection</text><text x="782" y="352" fill="#ABC6D8" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" text-anchor="start" >Never patches games or their SDKs.</text><rect x="70" y="381" width="623" height="71" rx="16" fill="#16283E" stroke="#385573" stroke-width="1.1"/><circle cx="100" cy="416" r="9" fill="none" stroke="#7DE9D3" stroke-width="2.5"/><path d="M95 416l4 4 8 -9" fill="none" stroke="#7DE9D3" stroke-width="2" stroke-linecap="round"/><text x="127" y="412" fill="#F0F8FE" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" >Local OCR</text><text x="127" y="436" fill="#ABC6D8" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" text-anchor="start" >Reads visible labels without uploads.</text><rect x="725" y="381" width="623" height="71" rx="16" fill="#16283E" stroke="#385573" stroke-width="1.1"/><circle cx="755" cy="416" r="9" fill="none" stroke="#FFABBA" stroke-width="2.5"/><path d="M750 411l10 10 M760 411l-10 10" fill="none" stroke="#FFABBA" stroke-width="2" stroke-linecap="round"/><text x="782" y="412" fill="#F0F8FE" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" >No traffic interception</text><text x="782" y="436" fill="#ABC6D8" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" text-anchor="start" >Does not tamper with ad networks.</text><rect x="70" y="465" width="623" height="71" rx="16" fill="#16283E" stroke="#385573" stroke-width="1.1"/><circle cx="100" cy="500" r="9" fill="none" stroke="#7DE9D3" stroke-width="2.5"/><path d="M95 500l4 4 8 -9" fill="none" stroke="#7DE9D3" stroke-width="2" stroke-linecap="round"/><text x="127" y="496" fill="#F0F8FE" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" >Learned button targets</text><text x="127" y="520" fill="#ABC6D8" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" text-anchor="start" >Small crops of corner close controls.</text><rect x="725" y="465" width="623" height="71" rx="16" fill="#16283E" stroke="#385573" stroke-width="1.1"/><circle cx="755" cy="500" r="9" fill="none" stroke="#FFABBA" stroke-width="2.5"/><path d="M750 495l10 10 M760 495l-10 10" fill="none" stroke="#FFABBA" stroke-width="2" stroke-linecap="round"/><text x="782" y="496" fill="#F0F8FE" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" >Avoid advertiser CTAs</text><text x="782" y="520" fill="#ABC6D8" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" text-anchor="start" >Rejects install and purchase prompts.</text><rect x="70" y="549" width="623" height="71" rx="16" fill="#16283E" stroke="#385573" stroke-width="1.1"/><circle cx="100" cy="584" r="9" fill="none" stroke="#7DE9D3" stroke-width="2.5"/><path d="M95 584l4 4 8 -9" fill="none" stroke="#7DE9D3" stroke-width="2" stroke-linecap="round"/><text x="127" y="580" fill="#F0F8FE" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" >Cautious clicks</text><text x="127" y="604" fill="#ABC6D8" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" text-anchor="start" >Bounded retries and checks before tapping.</text><rect x="725" y="549" width="623" height="71" rx="16" fill="#16283E" stroke="#385573" stroke-width="1.1"/><circle cx="755" cy="584" r="9" fill="none" stroke="#FFABBA" stroke-width="2.5"/><path d="M750 579l10 10 M760 579l-10 10" fill="none" stroke="#FFABBA" stroke-width="2" stroke-linecap="round"/><text x="782" y="580" fill="#F0F8FE" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" >No guaranteed rewards</text><text x="782" y="604" fill="#ABC6D8" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" text-anchor="start" >Only the game can confirm eligibility.</text><text x="700" y="693" fill="#9AB5C8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" text-anchor="middle" >Real-device verification is still required. Close timing does not establish reward completion.</text></svg>